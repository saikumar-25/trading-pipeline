name: eod-summary

# End-of-day summary ~15:35 IST (10:05 UTC), Mon-Fri.
on:
  schedule:
    - cron: "5 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: eod-summary
  cancel-in-progress: false

jobs:
  eod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-engine.txt
      - name: Restore token cache
        uses: actions/cache@v4
        with:
          path: token_cache.json
          key: dhan-token-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dhan-token-
      - name: Build EOD summary
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python eod_summary.py
      - name: Persist learning + logs
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add -f learning.json signals_log.csv paper_positions.csv oi_history.json 2>/dev/null || true
          git commit -m "eod summary [skip ci]" || echo "no changes"
          git push || echo "nothing to push"
